<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD Monitor Dashboard</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #111827, #0b1220 60%);
      color: #e5e7eb;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 18px;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .header p {
      color: #94a3b8;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      margin: 0;
    }

    /* STATUS BANNER */
    .banner {
      margin: 16px auto;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      font-weight: 600;
      font-size: clamp(0.85rem, 2.5vw, 1rem);

      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }

    .success-banner {
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
    }

    .fail-banner {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
    }

    .running-banner {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    /* CARD */
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px;
      border-radius: 16px;

      backdrop-filter: blur(14px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);

      transition: all 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .card:active {
      transform: scale(0.98);
    }

    .title {
      font-size: 0.98rem;
      font-weight: 600;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .card p {
      margin: 6px 0;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    /* BADGE */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .success {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .failure {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .running {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }

    /* LOADING */
    #loading {
      text-align: center;
      color: #94a3b8;
      padding: 14px;
      font-size: 0.9rem;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .container {
        padding: 12px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 400px) {
      .header h1 {
        font-size: 1.3rem;
      }

      .card {
        padding: 14px;
      }

      .card p {
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>CI/CD Monitor</h1>
    <p>Live GitHub Actions powered by Azure Functions</p>
  </div>

  <!-- STATUS BANNER -->
  <div id="banner"></div>

  <div id="loading">Loading workflows...</div>

  <!-- GRID -->
  <div class="grid" id="runs"></div>

</div>

<script>

const API_URL = "https://github-monitor-func-geaza8b2dfcagfbh.westeurope-01.azurewebsites.net/api/getWorkflowStatus";

async function loadWorkflows() {
  try {

    const res = await fetch(API_URL);
    const data = await res.json();

    const container = document.getElementById("runs");
    const banner = document.getElementById("banner");
    const loading = document.getElementById("loading");

    loading.style.display = "none";
    container.innerHTML = "";

    const latest = data.runs[0];

    // STATUS BANNER
    if (latest.conclusion === "success") {
      banner.className = "banner success-banner";
      banner.innerText = `Last Deployment: SUCCESS ✔ (${latest.branch})`;
    } else if (latest.conclusion === "failure") {
      banner.className = "banner fail-banner";
      banner.innerText = `Last Deployment: FAILED ✖ (${latest.branch})`;
    } else {
      banner.className = "banner running-banner";
      banner.innerText = `Last Deployment: RUNNING ⏳ (${latest.branch})`;
    }

    // CARDS
    data.runs.forEach(run => {

      const card = document.createElement("div");

      let statusClass = "running";
      if (run.conclusion === "success") statusClass = "success";
      if (run.conclusion === "failure") statusClass = "failure";

      card.className = "card";

      card.innerHTML = `
        <div class="title">${run.name}</div>
        <p><span class="badge ${statusClass}">${run.conclusion || "running"}</span></p>
        <p><b>Branch:</b> ${run.branch}</p>
        <p><b>Status:</b> ${run.status}</p>
        <p><b>Time:</b> ${new Date(run.created_at).toLocaleString()}</p>
      `;

      container.appendChild(card);
    });

  } catch (err) {
    document.getElementById("loading").innerText =
      "Error loading workflows";
    console.error(err);
  }
}

loadWorkflows();
setInterval(loadWorkflows, 10000);

</script>

</body>
</html>
