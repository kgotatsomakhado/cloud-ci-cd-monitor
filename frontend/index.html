<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD Monitor Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="header">
    <h1>CI/CD Monitor</h1>
    <p>Live GitHub Actions powered by Azure Functions</p>
  </div>

  <div id="banner"></div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat-card">
      <h3>Total</h3>
      <span id="totalRuns">0</span>
    </div>
    <div class="stat-card">
      <h3>Success</h3>
      <span id="successRuns">0</span>
    </div>
    <div class="stat-card">
      <h3>Failed</h3>
      <span id="failedRuns">0</span>
    </div>
    <div class="stat-card">
      <h3>Running</h3>
      <span id="runningRuns">0</span>
    </div>
  </div>

  <div id="loading">Loading workflows...</div>

  <div class="grid" id="runs"></div>

</div>

<footer style="text-align: center; padding:45px 9%; color:#94a3b8;font-size:14px;">
  <small>@ 2026 Built by Shumba Makhado, for efficiency</small>
</footer>

<script src="script.js"></script>

</body>
</html>
